name: Dev Server

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Validate Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build server image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t tfc-ci:test \
            .

  publish:
    name: Publish server image
    if: github.event_name == 'push'
    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set image name
        id: image
        shell: bash
        run: |
          IMAGE_NAME="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:dev

  deploy:
    name: Deploy to dev server
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.DEV_SERVER_SSH_KEY }}" > ~/.ssh/tfc_deploy
          chmod 600 ~/.ssh/tfc_deploy

          cat >> ~/.ssh/known_hosts <<'EOF'
          100.88.59.97 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAbx7YTeNdPCqsoHRvLvVemeXeL3NKjOwvTBZDrctPwP
          EOF

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy server
        shell: bash
        env:
          IMAGE_NAME: digitsterradev/modpack.terrfirmafactions
          SERVER_VERSION: ${{ github.sha }}
        run: |
          IMAGE_NAME="${IMAGE_NAME,,}"

          ssh \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/tfc_deploy \
            binary-server@100.88.59.97 \
            "wsl -d Ubuntu -u binary-server -- bash -s" <<EOF
          set -e
          cd ~/minecraft-dev

          printf 'SERVER_VERSION=%s\n' '$SERVER_VERSION' > .env
          printf 'SERVER_IMAGE=%s\n' 'ghcr.io/$IMAGE_NAME' >> .env

          export DOCKER_CONFIG="\$HOME/.docker-ghcr"

          docker compose pull
          docker compose up -d
          EOF