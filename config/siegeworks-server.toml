			playerAcceleration = 0.00275
			#Speed gained per tick while a horse is pulling.
			# Default: 0.0059375
			# Range: 0.0 ~ 10.0
			horseAcceleration = 0.0059375
			#Speed lost per tick after a direct operator releases forward or backward.
			# Default: 0.00275
			# Range: 0.0 ~ 10.0
			playerDeceleration = 0.00275
			#Speed lost per tick after a draft-mount rider releases forward or backward.
			# Default: 0.005588235294117647
			# Range: 0.0 ~ 10.0
			horseDeceleration = 0.005588235294117647
			#Maximum reverse speed as a fraction of forward speed.
			# Default: 0.55
			# Range: 0.0 ~ 1.0
			reverseSpeedMultiplier = 0.55
			#Degrees turned per tick while driven by a player.
			# Default: 0.65
			# Range: 0.0 ~ 180.0
			playerTurnDegreesPerTick = 0.65
			#Degrees turned per tick while pulled by a horse.
			# Default: 1.1227272727272728
			# Range: 0.0 ~ 180.0
			horseTurnDegreesPerTick = 1.1227272727272728

		#Firing, activation and loading timings.
		[engines.hwacha.operation]
			#Recovery time after firing or activating. Loading cannot begin during recovery.
			#Set to 0 to disable recovery.
			# Default: 100
			# Range: 0 ~ 72000
			recoveryTicks = 100

			#Loading stage durations. Winding stages also scale their reload animation to match.
			[engines.hwacha.operation.loading]
				# Default: 10
				# Range: 1 ~ 72000
				rocketTicks = 10
				# Default: 24
				# Range: 1 ~ 72000
				primingTicks = 24

#Gameplay rules that apply across all siege engines.
[rules]

	#Maximum deployed siege engines owned by one scoreboard team.
	#Players without a team are counted individually. Set a value to 0 for no limit.
	[rules.deploymentLimits]
		# Default: 0
		# Range: 0 ~ 100000
		serpentine = 0
		# Default: 0
		# Range: 0 ~ 100000
		culverin = 0
		# Default: 0
		# Range: 0 ~ 100000
		mons_meg = 0
		# Default: 0
		# Range: 0 ~ 100000
		tower_crossbow = 0
		# Default: 0
		# Range: 0 ~ 100000
		arcballista = 0
		# Default: 0
		# Range: 0 ~ 100000
		mangonel = 0
		# Default: 0
		# Range: 0 ~ 100000
		trebuchet = 0
		# Default: 0
		# Range: 0 ~ 100000
		battering_ram = 0
		# Default: 0
		# Range: 0 ~ 100000
		mantlet = 0
		# Default: 0
		# Range: 0 ~ 100000
		siege_tower = 0
		# Default: 0
		# Range: 0 ~ 100000
		siege_ladder = 0
		# Default: 0
		# Range: 0 ~ 100000
		hwacha = 0

	#Who may use, repair, dismantle and capture an owned siege engine.
	[rules.ownership]
		#Limit an owned engine to its owner, their scoreboard team and allied factions.
		#Disabling this lets anyone use any engine.
		enforceOwnership = false
		#Let the owner's team and allies dismantle the engine, not only the owner.
		teammatesMayDismantle = true
		#Let an enemy take an engine left without its crew by holding its controls unhurt.
		#Disabling this leaves enemies able only to destroy it.
		allowCapture = true
		#Allow capture only while the owner or a member of their team is online.
		captureRequiresDefenderOnline = false
		#Capture time grows with the engine's size, measured by the hammer strikes needed to dismantle it.
		# Default: 0.5
		# Range: 0.0 ~ 10.0
		captureSecondsPerDismantleHit = 0.5
		#Shortest capture time, in seconds.
		# Default: 8
		# Range: 1 ~ 600
		minimumCaptureSeconds = 8
		#Longest capture time, in seconds.
		# Default: 45
		# Range: 1 ~ 600
		maximumCaptureSeconds = 45
		#Release an engine to whoever uses it next once neither its owner nor anyone on their team
		#has been online for this many days. Set to 0 to keep ownership forever.
		# Default: 14
		# Range: 0 ~ 3650
		abandonAfterDays = 14

	#What siege weapons may do to the world.
	[rules.terrain]
		#Where projectiles and rams break blocks.
		#EVERYWHERE: anywhere.
		#RESPECT_PROTECTION: only where the player behind the engine could break the block by hand,
		#as claim mods and spawn protection decide. An offline owner is judged by their own profile.
		#NEVER: siege weapons harm creatures and engines but leave blocks whole.
		#Allowed Values: EVERYWHERE, RESPECT_PROTECTION, NEVER
		blockDamage = "EVERYWHERE"
		#Energy in joules to fracture one cubic metre of solid stone.
		#50000 is a gameplay value: thick walls should take minutes of repeated artillery fire, not days.
		#Higher values make blocks harder to destroy; lower values make them easier.
		#Other materials scale from stone. A datapack's fractureEnergy overrides this value for its blocks.
		#This changes craters and accumulated cracks, not flight, penetration resistance or entity damage.
		# Default: 50000.0
		# Range: 1.0 ~ 1.0E9
		stoneFractureEnergy = 50000.0

	#Incendiary pots, which burst only once lit. Their ingredients and burst values are datapack
	#profiles: data/<namespace>/definitions/pot_fillings/incendiary.json.
	[rules.incendiary]
		#How long a lit pot's fuse burns, in ticks, before it bursts wherever it is:
		#where it was placed, loaded in a stone thrower, or in flight.
		# Default: 140
		# Range: 20 ~ 1200
		fuseTicks = 140

[movement]
	#Collide a moving engine with the world using its model geometry instead of its bounding box alone.
	#An engine's box is smaller than its frame, so parts such as the arcballista's rear beam otherwise pass through terrain.
	#Disabling this restores bounding-box movement and its own step height.
	geometryTerrainCollision = true

#Performance-related settings that do not alter combat calculations.
[performance]

	#Physical block debris created by impacts and explosions.
	[performance.blockDebris]
		#Create flying block entities when impacts or explosions destroy blocks.
		#Disabling this does not change projectile trajectories, penetration, damage, or block destruction.
		enableFlyingBlockDebris = true
		#Maximum flying block entities created in one world tick.
		#This limit is shared by simultaneous impacts and explosions. Set to 0 to disable debris.
		# Default: 32
		# Range: 0 ~ 512
		maxFlyingBlockDebrisPerTick = 32

#Settings for optional mod integrations.
[integrations]

	#Villager Recruits integration settings.
	[integrations.recruits]
		#Maximum radius, in blocks, of an artillery fire zone selected on the Recruits map.
		# Default: 64
		# Range: 1 ~ 256
		maxFireZoneRadius = 64
