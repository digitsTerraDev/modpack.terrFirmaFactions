#Configurations for all things related to generated loot drops. Ex: end_city_treasure
["Loot Table Enhancements"]
	#Replace all enchanted loot into Rechanted books based on world_spawn_weight config from each rarity section
	#Example: A chest plate found with enchants will be replaced entirely with a rolled enchanted book based on the rarity configs
	replace_enchanted_loot = true
	#Removes mending enchantment from found enchanted loot from generated world loot. Ex: end_city_treasure
	#Mending books can be found only in book form as long as you have minecraft:mending set in a rarity pool.
	#Having REPLACE_ENCHANTED_LOOT set to true defaults this to true.
	remove_mending = true
	#Excludes gold, leather, stone, wood enchanted drops from being affected by the REPLACE_ENCHANTED_LOOT configuration
	#Example: Gold tools and armor from nether portal ruins will remain and not be replaced by Rechanted books
	exclude_lower_tier_loot = true
	#Without this enabled, fishing loot becomes an overpowered source for enchanted books when REPLACE_ENCHANTED_LOOT is enabled
	#Also makes enchanted fished treasure have weaker enchants (level 5 enchants) and excludes it from REPLACE_ENCHANTED_LOOT
	#Example: Enchanted bows and fishing rods will now commonly have Power I or Lure I respectively but still roll with Unbreaking I
	#We recommend enabling this if using Rechanted with Tide/Tide 2.0, otherwise players are showered in books when using Luck of the Sea
	nerf_fishing_loot = false
	#Chance for replaced world loot books to become a random gem instead.
	#Set to 0 to disable. Gems from this roll are uniform across all mod gems.
	# Default: 0.002
	# Range: 0.0 ~ 1.0
	world_loot_gem_drop_chance = 0.002
	#To nerf overpowered XP farms using the infestation and oozing potions.
	disable_xp_from_slimes_and_silverfish = false
	gear_break_warning_enabled = true

	#Settings that control villager trade modifications
	["Loot Table Enhancements"."Villager Trades"]
		#If false, villager trades are left untouched (no enchanted book replacement or enchant stripping).
		modify_villager_trades = true
		#Cost in emeralds for the mysterious book trade when replacing enchanted books.
		# Default: 32
		# Range: 1 ~ 64
		mysterious_book_emerald_cost = 32
		# Default: 8
		# Range: 1 ~ 64
		dusty_mysterious_book_emerald_cost = 8

	#Settings to control Fortune enchantment drop multipliers
	["Loot Table Enhancements"."Fortune Nerf"]
		#If enabled, fortune will only double drops based on the chances defined at each level
		nerf_enabled = false
		# Default: 0.33
		# Range: 0.0 ~ 1.0
		fortune_1_chance = 0.33
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		fortune_2_chance = 0.5
		# Default: 0.65
		# Range: 0.0 ~ 1.0
		fortune_3_chance = 0.65

