	#Global weighted pools used by bonus item rewards.
	#Format: <gem-item-name>|<weight>
	common_gem_pool = ["rechanted:chance_gem|75", "rechanted:warp_gem|35", "rechanted:lucky_gem|35", "rechanted:tasty_gem|20"]
	rare_gem_pool = ["rechanted:shiny_chance_gem|30", "rechanted:return_gem|20", "rechanted:clone_gem|20", "rechanted:smithing_gem|15"]
	#The game will broadcast a message to all players if a player gets any listed enchantments within the level range to drop from the enchantment table
	#Format: <enchantment>|<level-range>
