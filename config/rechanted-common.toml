	announce_enchantments = ["rechanted:blitz|4", "rechanted:volley|3", "rechanted:overload|3", "rechanted:thunder_strike|4", "minecraft:fortune|1-3", "rechanted:inquisitive|4", "minecraft:looting|3", "rechanted:rebirth|1"]
	compatible_tooltip_items = ["minecraft:iron_helmet", "minecraft:iron_chestplate", "minecraft:iron_leggings", "minecraft:iron_boots", "minecraft:iron_pickaxe", "minecraft:iron_axe", "minecraft:iron_shovel", "minecraft:iron_hoe", "minecraft:iron_sword", "minecraft:fishing_rod", "minecraft:trident", "minecraft:shield", "minecraft:bow", "minecraft:crossbow", "minecraft:elytra", "minecraft:iron_spear", "minecraft:mace"]
